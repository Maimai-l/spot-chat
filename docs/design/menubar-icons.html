<!doctype html>
<html lang="zh-Hans"><head><meta charset="utf-8"><title>Menu Bar Icons</title>
<style>
:root{--light:#e9e9eb;--dark:#232325}
*{box-sizing:border-box}
body{margin:0;background:#fff;font-family:-apple-system,"SF Pro Text","PingFang SC",sans-serif;color:rgba(0,0,0,.85);padding:32px 40px;width:1180px;height:max-content}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:28px 32px}
.card{border-radius:14px;background:#f6f6f7;padding:18px 20px 16px}
.name{font-size:15px;font-weight:600;margin:0 0 12px}
.big{display:flex;gap:18px;align-items:center;margin-bottom:14px}
.big svg{width:72px;height:72px}
.bar{height:24px;border-radius:6px;display:flex;align-items:center;justify-content:flex-end;gap:14px;padding:0 12px;margin-top:8px;font-size:13px}
.bar.light{background:var(--light);color:#000}
.bar.dark{background:var(--dark);color:#fff}
.bar svg{width:16px;height:16px}
.sys{opacity:.9}
.now{outline:1.5px solid rgba(255,59,48,.0)}
</style></head><body>
<svg width="0" height="0" style="position:absolute">
  <defs>
    <!-- A: the reply mark, a dot with a highlight cut out -->
    <symbol id="A" viewBox="0 0 18 18">
      <mask id="mA"><rect width="18" height="18" fill="#fff"/><circle cx="11.4" cy="6.6" r="2.1" fill="#000"/></mask>
      <circle cx="9" cy="9" r="7" fill="currentColor" mask="url(#mA)"/>
    </symbol>
    <!-- B: a speech bubble with the dot inside -->
    <symbol id="B" viewBox="0 0 18 18">
      <path d="M9 2.4c3.9 0 6.9 2.6 6.9 5.9S12.9 14.2 9 14.2c-.8 0-1.6-.1-2.3-.3L3.4 15.7l.9-3C2.9 11.6 2.1 10 2.1 8.3 2.1 5 5.1 2.4 9 2.4z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
      <circle cx="9" cy="8.3" r="2.1" fill="currentColor"/>
    </symbol>
    <!-- C: a filled speech bubble with the highlight cut out -->
    <symbol id="C" viewBox="0 0 18 18">
      <mask id="mC"><rect width="18" height="18" fill="#fff"/><circle cx="11.6" cy="6.2" r="1.9" fill="#000"/></mask>
      <path d="M9 2.4c3.9 0 6.9 2.6 6.9 5.9S12.9 14.2 9 14.2c-.8 0-1.6-.1-2.3-.3L3.4 15.7l.9-3C2.9 11.6 2.1 10 2.1 8.3 2.1 5 5.1 2.4 9 2.4z" fill="currentColor" mask="url(#mC)"/>
    </symbol>
    <!-- D: the input bar, a capsule with the dot at its start -->
    <symbol id="D" viewBox="0 0 18 18">
      <rect x="1.4" y="5" width="15.2" height="8" rx="4" fill="none" stroke="currentColor" stroke-width="1.5"/>
      <circle cx="5.4" cy="9" r="1.7" fill="currentColor"/>
      <path d="M8.6 9h4.6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
    </symbol>
    <!-- E: the floating card, a window with the input bar at its foot -->
    <symbol id="E" viewBox="0 0 18 18">
      <rect x="2.6" y="1.8" width="12.8" height="14.4" rx="3.6" fill="none" stroke="currentColor" stroke-width="1.5"/>
      <rect x="4.9" y="11" width="8.2" height="2.9" rx="1.45" fill="currentColor"/>
      <circle cx="7.2" cy="6.2" r="1.5" fill="currentColor"/>
    </symbol>
    <!-- Now: smallcircle.filled.circle -->
    <symbol id="N" viewBox="0 0 18 18">
      <circle cx="9" cy="9" r="6.6" fill="none" stroke="currentColor" stroke-width="1.5"/>
      <circle cx="9" cy="9" r="3" fill="currentColor"/>
    </symbol>
    <!-- Stand-ins for other menu bar items -->
    <symbol id="wifi" viewBox="0 0 18 18"><path d="M2.5 7.2a9.5 9.5 0 0 1 13 0M4.8 9.6a6.2 6.2 0 0 1 8.4 0M7.1 12a2.8 2.8 0 0 1 3.8 0" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><circle cx="9" cy="14.2" r="1.1" fill="currentColor"/></symbol>
    <symbol id="search" viewBox="0 0 18 18"><circle cx="7.8" cy="7.8" r="4.6" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M11.2 11.2l3.6 3.6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></symbol>
  </defs>
</svg>

<div class="grid" id="grid"></div>
<script>
const options = [
  ["N", "现在"],
  ["A", "A 标志圆点"],
  ["B", "B 气泡和圆点"],
  ["C", "C 实心气泡"],
  ["D", "D 输入条"],
  ["E", "E 浮窗"],
];
const grid = document.getElementById("grid");
for (const [id, name] of options) {
  const icon = (size) => `<svg width="${size}" height="${size}"><use href="#${id}"/></svg>`;
  const bar = (mode) => `<div class="bar ${mode}">
      <svg class="sys"><use href="#wifi"/></svg><svg class="sys"><use href="#search"/></svg>
      ${icon(16)}<span>周六 15:12</span></div>`;
  grid.insertAdjacentHTML("beforeend", `<div class="card">
    <div class="name">${name}</div>
    <div class="big">${icon(72)}<span style="color:#fff;background:#232325;border-radius:12px;padding:6px">${icon(60)}</span></div>
    ${bar("light")}${bar("dark")}
  </div>`);
}
</script>
</body></html>
