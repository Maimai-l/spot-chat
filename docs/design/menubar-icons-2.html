<!doctype html>
<html lang="zh-Hans"><head><meta charset="utf-8"><title>Menu Bar Icons 2</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#fff;font-family:-apple-system,"SF Pro Text","PingFang SC",sans-serif;color:rgba(0,0,0,.85);padding:32px 40px;width:1180px;height:max-content}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:28px 32px}
.card{border-radius:14px;background:#f6f6f7;padding:18px 20px 16px}
.name{font-size:15px;font-weight:600;margin:0 0 12px}
.big{display:flex;gap:16px;align-items:center;margin-bottom:14px}
.tile{width:72px;height:72px;border-radius:17px;display:grid;place-items:center}
.tile.dark{background:#232325;color:#fff}
.tile.app{background:linear-gradient(180deg,#fff,#eef1f6);box-shadow:0 0 0 .5px rgba(0,0,0,.12),0 2px 6px rgba(0,0,0,.12);color:#2e6fe8}
.bar{height:24px;border-radius:6px;display:flex;align-items:center;justify-content:flex-end;gap:14px;padding:0 12px;margin-top:8px;font-size:13px}
.bar.light{background:#e9e9eb;color:#000}
.bar.dark{background:#232325;color:#fff}
.bar svg{width:16px;height:16px}
</style></head><body>
<svg width="0" height="0" style="position:absolute">
  <defs>
    <!-- F: a dot with a four-point spark cut out of it -->
    <symbol id="F" viewBox="0 0 18 18">
      <mask id="mF"><rect width="18" height="18" fill="#fff"/>
        <path d="M9 4.3C9.55 7.5 10.5 8.45 13.7 9 10.5 9.55 9.55 10.5 9 13.7 8.45 10.5 7.5 9.55 4.3 9 7.5 8.45 8.45 7.5 9 4.3Z" fill="#000"/></mask>
      <circle cx="9" cy="9" r="7.2" fill="currentColor" mask="url(#mF)"/>
    </symbol>
    <!-- G: a dot with a tail, a spot on the move -->
    <symbol id="G" viewBox="0 0 18 18">
      <path d="M13.9 9.1 2.6 15.4 8.9 4.1Z" fill="currentColor" opacity=".45"/>
      <circle cx="11.4" cy="6.6" r="3.8" fill="currentColor"/>
    </symbol>
    <!-- H: an S in one stroke, its top end a dot -->
    <symbol id="H" viewBox="0 0 18 18">
      <path d="M10.4 3.1C10 3 9.5 2.9 9 2.9 6.8 2.9 5.2 4.2 5.2 6 5.2 9.7 12.9 8.3 12.9 12.1 12.9 14 11.2 15.2 9 15.2 7.4 15.2 6 14.6 5.1 13.4" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round"/>
      <circle cx="13.2" cy="4.3" r="1.9" fill="currentColor"/>
    </symbol>
    <!-- K: a drop of ink with a highlight -->
    <symbol id="K" viewBox="0 0 18 18">
      <mask id="mK"><rect width="18" height="18" fill="#fff"/><circle cx="11" cy="10.6" r="1.5" fill="#000"/></mask>
      <path d="M9 1.8C9 1.8 3.9 7.5 3.9 11.1A5.1 5.1 0 0 0 14.1 11.1C14.1 7.5 9 1.8 9 1.8Z" fill="currentColor" mask="url(#mK)"/>
    </symbol>
    <!-- L: a large dot and a small one, a question and its reply -->
    <symbol id="L" viewBox="0 0 18 18">
      <circle cx="7.4" cy="10.6" r="5.4" fill="currentColor"/>
      <circle cx="14.2" cy="4.4" r="2.5" fill="currentColor"/>
    </symbol>
    <symbol id="wifi" viewBox="0 0 18 18"><path d="M2.5 7.2a9.5 9.5 0 0 1 13 0M4.8 9.6a6.2 6.2 0 0 1 8.4 0M7.1 12a2.8 2.8 0 0 1 3.8 0" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><circle cx="9" cy="14.2" r="1.1" fill="currentColor"/></symbol>
    <symbol id="search" viewBox="0 0 18 18"><circle cx="7.8" cy="7.8" r="4.6" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M11.2 11.2l3.6 3.6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></symbol>
  </defs>
</svg>
<div class="grid" id="grid"></div>
<script>
const options = [["F", "F 光斑"], ["G", "G 彗星"], ["H", "H S 字"], ["K", "K 墨点"], ["L", "L 双圆"]];
const grid = document.getElementById("grid");
const icon = (id, size) => `<svg width="${size}" height="${size}"><use href="#${id}"/></svg>`;
for (const [id, name] of options) {
  const bar = (mode) => `<div class="bar ${mode}"><svg><use href="#wifi"/></svg><svg><use href="#search"/></svg>${icon(id, 16)}<span>周六 15:12</span></div>`;
  grid.insertAdjacentHTML("beforeend", `<div class="card">
    <div class="name">${name}</div>
    <div class="big">${icon(id, 72)}<div class="tile dark">${icon(id, 52)}</div><div class="tile app">${icon(id, 46)}</div></div>
    ${bar("light")}${bar("dark")}
  </div>`);
}
</script>
</body></html>
