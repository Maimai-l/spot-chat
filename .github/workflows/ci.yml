name: CI

# While iterating, a commit can run only some UI tests by naming them in its message, for example
# "[ui: testLayoutScreenshots testSendButtonAppearsOnlyWithText]". Without that, every UI test runs.
# The core tests run only when the core package, the reply page or the mock server changed.
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      ui_tests:
        description: UI tests to run, separated by spaces. Empty runs all of them.
        required: false
        default: ""

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-tests:
    name: Core logic tests
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check whether core code changed
        id: changes
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != "push" ] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$BEFORE" "$GITHUB_SHA" | grep -qE '^(Packages/|Web/|App/Reply/|scripts/|\.github/)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No changes to the core package, the reply page or the mock server; skipping."
          fi
      - name: Select Xcode 16
        if: steps.changes.outputs.run == 'true'
        run: |
          for v in 16.4 16.3 16.2 16.1 16; do
            if [ -d "/Applications/Xcode_$v.app" ]; then sudo xcode-select -s "/Applications/Xcode_$v.app"; break; fi
          done
          xcodebuild -version
      - name: Start mock OpenAI server
        if: steps.changes.outputs.run == 'true'
        run: nohup python3 scripts/mock_openai_server.py 8765 > mock-server.log 2>&1 &
      - name: Run tests
        if: steps.changes.outputs.run == 'true'
        env:
          MOCK_OPENAI_BASE_URL: http://127.0.0.1:8765/v1
        run: swift test --package-path Packages/SpotKit
      - name: Test the reply page and check its build is committed
        if: steps.changes.outputs.run == 'true'
        working-directory: Web
        run: |
          npm ci
          npm test
          npm run check

  app:
    name: Build app and run UI tests
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 16
        run: |
          for v in 16.4 16.3 16.2 16.1 16; do
            if [ -d "/Applications/Xcode_$v.app" ]; then sudo xcode-select -s "/Applications/Xcode_$v.app"; break; fi
          done
          xcodebuild -version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Start mock OpenAI server
        run: nohup python3 scripts/mock_openai_server.py 8765 > mock-server.log 2>&1 &
      - name: Allow UI automation
        run: sudo automationmodetool enable-automationmode-without-authentication || true
      - name: Choose UI tests
        env:
          MESSAGE: ${{ github.event.head_commit.message }}
          REQUESTED: ${{ github.event.inputs.ui_tests }}
        run: |
          tests="$REQUESTED"
          if [ -z "$tests" ]; then
            tests="$(printf '%s\n' "$MESSAGE" | sed -n 's/.*\[ui: *\([^]]*\)\].*/\1/p' | head -n 1)"
          fi
          only=""
          for test in $tests; do
            only="$only -only-testing:SpotChatUITests/SpotChatUITests/$test"
          done
          echo "ONLY_TESTING=$only" >> "$GITHUB_ENV"
          echo "UI tests: ${tests:-all}"
      - name: Run UI tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project SpotChat.xcodeproj \
            -scheme SpotChat \
            -destination 'platform=macOS' \
            -derivedDataPath build/DerivedData \
            -resultBundlePath build/UITests.xcresult \
            $ONLY_TESTING
      - name: Build release app
        run: |
          set -o pipefail
          xcodebuild build \
            -project SpotChat.xcodeproj \
            -scheme SpotChat \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath build/DerivedData \
            CURRENT_PROJECT_VERSION=${{ github.run_number }}
      - name: Package alpha build
        run: |
          VERSION="$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' build/DerivedData/Build/Products/Release/SpotChat.app/Contents/Info.plist)"
          echo "ALPHA_NAME=SpotChat-$VERSION-alpha.${{ github.run_number }}" >> "$GITHUB_ENV"
          ditto -c -k --keepParent build/DerivedData/Build/Products/Release/SpotChat.app "build/SpotChat-$VERSION-alpha.${{ github.run_number }}.zip"
      - name: Upload alpha build
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ALPHA_NAME }}
          path: build/${{ env.ALPHA_NAME }}.zip
      - name: Upload UI test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: UITests-result
          path: build/UITests.xcresult
          if-no-files-found: ignore
