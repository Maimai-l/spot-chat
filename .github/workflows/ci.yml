name: CI

# What a push runs is chosen by tags in its commit message:
#   no tag                     every UI test, and the release app packaged as an alpha
#   [ui: testA testB]          only those UI tests, no release build
#   [ui: none]                 no UI tests
#   [release]                  the release build as well, e.g. "[ui: none] [release]" to only package
# The core tests run when the core package, the reply page, the mock server or CI changed.
# UI tests and the release build run side by side on separate machines.
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      ui_tests:
        description: UI tests to run, separated by spaces; empty runs all of them, "none" runs none.
        required: false
        default: ""
      release:
        description: Build and package the release app.
        type: boolean
        default: true

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    name: Choose what to run
    runs-on: ubuntu-latest
    outputs:
      core: ${{ steps.plan.outputs.core }}
      ui: ${{ steps.plan.outputs.ui }}
      only: ${{ steps.plan.outputs.only }}
      release: ${{ steps.plan.outputs.release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Read the commit's tags
        id: plan
        env:
          MESSAGE: ${{ github.event.head_commit.message }}
          BEFORE: ${{ github.event.before }}
          REQUESTED: ${{ github.event.inputs.ui_tests }}
          REQUESTED_RELEASE: ${{ github.event.inputs.release }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            tests="$REQUESTED"
            release="$REQUESTED_RELEASE"
          else
            tests="$(printf '%s\n' "$MESSAGE" | sed -n 's/.*\[ui: *\([^]]*\)\].*/\1/p' | head -n 1)"
            if [ -z "$tests" ] || printf '%s\n' "$MESSAGE" | grep -q '\[release\]'; then release=true; else release=false; fi
          fi
          if [ "$tests" = "none" ]; then
            echo "ui=false" >> "$GITHUB_OUTPUT"
          else
            echo "ui=true" >> "$GITHUB_OUTPUT"
            only=""
            for test in $tests; do only="$only -only-testing:SpotChatUITests/SpotChatUITests/$test"; done
            echo "only=$only" >> "$GITHUB_OUTPUT"
          fi
          echo "release=$release" >> "$GITHUB_OUTPUT"

          if [ "$GITHUB_EVENT_NAME" != "push" ] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            core=true
          elif git diff --name-only "$BEFORE" "$GITHUB_SHA" | grep -qE '^(Packages/|Web/|App/Reply/|scripts/|\.github/)'; then
            core=true
          else
            core=false
          fi
          echo "core=$core" >> "$GITHUB_OUTPUT"
          echo "UI tests: ${tests:-all}; release build: $release; core tests: $core"
          {
            echo "## Plan"
            echo
            echo "UI tests: ${tests:-all}"
            echo "Release build: $release"
            echo "Core tests: $core"
          } >> "$GITHUB_STEP_SUMMARY"

  core-tests:
    name: Core logic tests
    needs: plan
    if: needs.plan.outputs.core == 'true'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 16
        run: |
          for v in 16.4 16.3 16.2 16.1 16; do
            if [ -d "/Applications/Xcode_$v.app" ]; then sudo xcode-select -s "/Applications/Xcode_$v.app"; break; fi
          done
          xcodebuild -version
      - name: Start mock OpenAI server
        run: nohup python3 scripts/mock_openai_server.py 8765 > mock-server.log 2>&1 &
      - name: Run tests
        env:
          MOCK_OPENAI_BASE_URL: http://127.0.0.1:8765/v1
        run: swift test --package-path Packages/SpotKit
      - name: Test the reply page and check its build is committed
        working-directory: Web
        run: |
          npm ci
          npm test
          npm run check

  ui-tests:
    name: UI tests
    needs: plan
    if: needs.plan.outputs.ui == 'true'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/prepare-app
      - name: Start mock OpenAI server
        run: nohup python3 scripts/mock_openai_server.py 8765 > mock-server.log 2>&1 &
      - name: Allow UI automation
        run: sudo automationmodetool enable-automationmode-without-authentication || true
      - name: Run UI tests
        env:
          ONLY_TESTING: ${{ needs.plan.outputs.only }}
        run: |
          set -o pipefail
          xcodebuild test \
            -project SpotChat.xcodeproj \
            -scheme SpotChat \
            -destination 'platform=macOS' \
            -derivedDataPath build/DerivedData \
            -clonedSourcePackagesDirPath build/SourcePackages \
            -resultBundlePath build/UITests.xcresult \
            $ONLY_TESTING
      - name: Export screenshots and summarize
        if: always()
        run: python3 scripts/export_test_results.py build/UITests.xcresult build/Screenshots "$GITHUB_STEP_SUMMARY"
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Screenshots
          path: build/Screenshots
          if-no-files-found: ignore
      - name: Upload UI test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: UITests-result
          path: build/UITests.xcresult
          if-no-files-found: ignore

  release:
    name: Release build
    needs: plan
    if: needs.plan.outputs.release == 'true'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/prepare-app
      - name: Build release app
        run: |
          set -o pipefail
          xcodebuild build \
            -project SpotChat.xcodeproj \
            -scheme SpotChat \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath build/DerivedData \
            -clonedSourcePackagesDirPath build/SourcePackages \
            CURRENT_PROJECT_VERSION=${{ github.run_number }}
      - name: Package alpha build
        run: |
          VERSION="$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' build/DerivedData/Build/Products/Release/SpotChat.app/Contents/Info.plist)"
          echo "ALPHA_NAME=SpotChat-$VERSION-alpha.${{ github.run_number }}" >> "$GITHUB_ENV"
          ditto -c -k --keepParent build/DerivedData/Build/Products/Release/SpotChat.app "build/SpotChat-$VERSION-alpha.${{ github.run_number }}.zip"
      - name: Upload alpha build
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ALPHA_NAME }}
          path: build/${{ env.ALPHA_NAME }}.zip
      - name: Summarize
        run: echo "## Release build"$'\n\n'"$ALPHA_NAME" >> "$GITHUB_STEP_SUMMARY"
