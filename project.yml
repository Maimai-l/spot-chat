name: SpotChat
options:
  bundleIdPrefix: com.maimai
  developmentLanguage: en
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "0"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: NO
    # Sparkle's public EdDSA key; updates are signed with its private key, a CI secret. Empty turns updates off.
    SPARKLE_PUBLIC_KEY: ""
    # The runtime-embedding script copies a folder Xcode doesn't track.
    ENABLE_USER_SCRIPT_SANDBOXING: NO
packages:
  SpotKit:
    path: Packages/SpotKit
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    from: "2.0.0"
  # Writes the app's log to rolling files and the system log. 3.9.1 and later need a newer Swift than CI's.
  CocoaLumberjack:
    url: https://github.com/CocoaLumberjack/CocoaLumberjack
    exactVersion: "3.9.0"
  # Updates alpha builds from the feed CI publishes to GitHub Pages, with deltas between builds.
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: "2.10.1"
targets:
  SpotChat:
    type: application
    platform: macOS
    sources:
      - path: App
        excludes:
          - Reply/**
      # The reply page, built from Web/ by `npm run build`, kept as a folder in the app bundle.
      - path: App/Reply
        type: folder
        buildPhase: resources
    dependencies:
      - package: SpotKit
        product: SpotCore
      - package: SpotKit
        product: SpotData
      - package: SpotKit
        product: SpotAI
      - package: SpotKit
        product: SpotAgent
      - package: KeyboardShortcuts
      - package: CocoaLumberjack
        product: CocoaLumberjackSwift
      - package: CocoaLumberjack
        product: CocoaLumberjackSwiftLogBackend
      - package: Sparkle
      # Writes chat replies in a process of its own, so they finish and are saved after the app quits.
      - target: SpotChatWriter
        embed: true
        codeSign: true
        copy:
          destination: executables
    postBuildScripts:
      # The dsh runtime for running commands, built into build/AgentRuntime by
      # scripts/build_agent_runtime.py. Builds without it simply leave the feature unavailable.
      - name: Embed command runtime
        basedOnDependencyAnalysis: false
        script: |
          if [ -d "$SRCROOT/build/AgentRuntime" ]; then
            mkdir -p "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/Agent"
            rsync -a --delete "$SRCROOT/build/AgentRuntime/" "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/Agent/"
          fi
      # Spot Chat's plugin for the DeepSeek Harness the user runs; Settings copies the command that adds it.
      - name: Embed DeepSeek Harness plugin
        basedOnDependencyAnalysis: false
        script: |
          mkdir -p "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/dsh-bridge"
          rsync -a --delete "$SRCROOT/agent/bridge/" "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/dsh-bridge/"
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Spot Chat
        CFBundleName: Spot Chat
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true
        NSServices:
          - NSMenuItem:
              default: Ask Spot Chat
            NSMessage: askAboutSelection
            NSPortName: Spot Chat
            NSSendTypes:
              - public.utf8-plain-text
              - NSStringPboardType
        LSApplicationCategoryType: public.app-category.productivity
        UIDesignRequiresCompatibility: true
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, zh-Hans]
        SpotChatReleaseChannel: alpha
        SUFeedURL: https://maimai-l.github.io/spot-chat/appcast.xml
        SUPublicEDKey: $(SPARKLE_PUBLIC_KEY)
        SUEnableAutomaticChecks: true
        # Every six hours, as alphas come often.
        SUScheduledCheckInterval: 21600
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.maimai.spotchat
        PRODUCT_NAME: SpotChat
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  SpotChatWriter:
    type: tool
    platform: macOS
    sources:
      - Writer
      - App/AppLogging.swift
      - App/CrashReports.swift
      - App/ErrorText.swift
    dependencies:
      - package: SpotKit
        product: SpotCore
      - package: SpotKit
        product: SpotData
      - package: SpotKit
        product: SpotAI
      - package: CocoaLumberjack
        product: CocoaLumberjackSwift
      - package: CocoaLumberjack
        product: CocoaLumberjackSwiftLogBackend
    settings:
      base:
        PRODUCT_NAME: SpotChatWriter
        PRODUCT_BUNDLE_IDENTIFIER: com.maimai.spotchat.writer
        SKIP_INSTALL: YES
  SpotChatUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - UITests
    dependencies:
      - target: SpotChat
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.maimai.spotchat.uitests
        TEST_TARGET_NAME: SpotChat
        GENERATE_INFOPLIST_FILE: YES
schemes:
  SpotChat:
    build:
      targets:
        SpotChat: all
        SpotChatUITests: [test]
    test:
      config: Debug
      targets:
        - SpotChatUITests
