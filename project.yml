name: SpotChat
options:
  bundleIdPrefix: com.maimai
  developmentLanguage: en
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "0"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: NO
packages:
  SpotKit:
    path: Packages/SpotKit
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    from: "2.0.0"
  Textual:
    url: https://github.com/gonzalezreal/textual
    minorVersion: 0.5.0
targets:
  SpotChat:
    type: application
    platform: macOS
    sources:
      - App
    dependencies:
      - package: SpotKit
        product: SpotCore
      - package: SpotKit
        product: SpotData
      - package: SpotKit
        product: SpotAI
      - package: KeyboardShortcuts
      - package: Textual
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Spot Chat
        CFBundleName: Spot Chat
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.productivity
        UIDesignRequiresCompatibility: true
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, zh-Hans]
        SpotChatReleaseChannel: alpha
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.maimai.spotchat
        PRODUCT_NAME: SpotChat
  SpotChatUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - UITests
    dependencies:
      - target: SpotChat
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.maimai.spotchat.uitests
        TEST_TARGET_NAME: SpotChat
        GENERATE_INFOPLIST_FILE: YES
schemes:
  SpotChat:
    build:
      targets:
        SpotChat: all
        SpotChatUITests: [test]
    test:
      config: Debug
      targets:
        - SpotChatUITests
