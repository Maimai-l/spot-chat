name: SpotChat
options:
  bundleIdPrefix: com.maimai
  developmentLanguage: en
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "0"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: NO
    # The runtime-embedding script copies a folder Xcode doesn't track.
    ENABLE_USER_SCRIPT_SANDBOXING: NO
packages:
  SpotKit:
    path: Packages/SpotKit
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    from: "2.0.0"
targets:
  SpotChat:
    type: application
    platform: macOS
    sources:
      - path: App
        excludes:
          - Reply/**
      # The reply page, built from Web/ by `npm run build`, kept as a folder in the app bundle.
      - path: App/Reply
        type: folder
        buildPhase: resources
    dependencies:
      - package: SpotKit
        product: SpotCore
      - package: SpotKit
        product: SpotData
      - package: SpotKit
        product: SpotAI
      - package: SpotKit
        product: SpotAgent
      - package: KeyboardShortcuts
    postBuildScripts:
      # The dsh runtime for running commands, built into build/AgentRuntime by
      # scripts/build_agent_runtime.py. Builds without it simply leave the feature unavailable.
      - name: Embed command runtime
        basedOnDependencyAnalysis: false
        script: |
          if [ -d "$SRCROOT/build/AgentRuntime" ]; then
            mkdir -p "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/Agent"
            rsync -a --delete "$SRCROOT/build/AgentRuntime/" "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/Agent/"
          fi
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Spot Chat
        CFBundleName: Spot Chat
        LSUIElement: true
        NSServices:
          - NSMenuItem:
              default: Ask Spot Chat
            NSMessage: askAboutSelection
            NSPortName: Spot Chat
            NSSendTypes:
              - public.utf8-plain-text
              - NSStringPboardType
        LSApplicationCategoryType: public.app-category.productivity
        UIDesignRequiresCompatibility: true
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, zh-Hans]
        SpotChatReleaseChannel: alpha
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.maimai.spotchat
        PRODUCT_NAME: SpotChat
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  SpotChatUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - UITests
    dependencies:
      - target: SpotChat
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.maimai.spotchat.uitests
        TEST_TARGET_NAME: SpotChat
        GENERATE_INFOPLIST_FILE: YES
schemes:
  SpotChat:
    build:
      targets:
        SpotChat: all
        SpotChatUITests: [test]
    test:
      config: Debug
      targets:
        - SpotChatUITests
